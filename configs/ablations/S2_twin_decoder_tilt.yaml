# Static Ablation S2: Parallel DAAB + StaticCollapseMTCSA + StaticTwinNAFDecoder (With L_tilt + L_TV, Without Wiener)
_base_: "../default.yaml"

experiment:
  name: "S2_twin_decoder_tilt"

model:
  prior_extractor:
    name: "classical_full"
    enable_motion_mask: false
  alignment:
    name: "daab_static_parallel"
  fusion:
    name: "mtcsa_static_collapse"
    spatial_window: 8
    num_heads: 4
  deconv:
    name: "identity_upsample"
  decoder:
    name: "static_twin_naf_decoder"
    num_blocks_s2: 4
    num_blocks_s1: 6
    max_tilt_displacement: 16.0
    anchor_mode: "auto"

loss:
  lambda_tilt: 0.2
  lambda_tv: 0.01
