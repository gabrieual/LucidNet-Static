# Default Base Configuration for LucidNet-Static (Static Many-to-One CWD-Net)
experiment:
  name: "S3_lucid_static_full"
  seed: 42
  deterministic: false
  output_root: "experiments"
  use_wandb: false
  wandb_project: "lucidnet-static"
  wandb_entity: null
  wandb_group: "lucidnet-static-ablations"
  wandb_run_id: null

data:
  dataset_type: "atsyn"
  train_root: "datasets/ATSyn_static/train"
  val_root: "datasets/ATSyn_static/test"
  test_root: "datasets/ATSyn_static/test"
  num_frames: 8
  crop_size: 256
  batch_size: 4
  num_workers: 4
  allow_synthetic_fallback: false
  fallback_length: 64
  static_target: true
  return_all_frames: false

model:
  dims:
    c1: 64
    c2: 96
    c3: 128
    deconv_channels: 64
  prior_extractor:
    name: "classical_full"
    enable_stabilization: true
    stabilize_in_train: false
    use_frf: true
    enable_motion_mask: false
    frf_bandwidth: 0.05
    frf_sigma: 0.5
    frf_patch_size: 8
    lambda_s: 0.02
    outlier_weight: 1.0
  encoder:
    name: "shallow_multiscale"
  alignment:
    name: "daab_static_parallel"
    num_groups: 8
    num_samples: 4
    max_offset: 6.0
    num_rdbs: 4
    growth_rate: 32
    use_checkpoint: false
  fusion:
    name: "mtcsa_static_collapse"
    spatial_window: 8
    num_heads: 4
  deconv:
    name: "wiener_fft_multichannel"
    kernel_size: 15
    eps_min: 0.01
    pad_size: 8
  decoder:
    name: "static_twin_naf_decoder"
    num_blocks_s2: 4
    num_blocks_s1: 6
    max_tilt_displacement: 16.0
    anchor_mode: "auto"

loss:
  lambda_char: 0.8
  lambda_tilt: 0.2
  lambda_fft: 0.05
  lambda_tv: 0.01
  lambda_cw_ssim: 0.1
  lambda_lpips: 0.02
  phase2_start_ratio: 0.70
  charbonnier_eps: 0.001
  use_lpips: false

train:
  total_iters: 80000
  warmup_iters: 2000
  lr: 0.0002
  min_lr: 0.000001
  weight_decay: 0.0001
  grad_clip_norm: 20.0
  grad_accum_steps: 1
  ema_decay: 0.999
  use_amp: true
  amp_dtype: "bfloat16"
  log_interval: 50
  val_interval: 2000
  save_interval: 5000
  keep_last_k_checkpoints: 3

inference:
  window_size: 12
  temporal_stride: 6
  tile_size: 256
  tile_overlap: 64
  mode: "static_burst"
